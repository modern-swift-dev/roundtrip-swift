name: CI

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
          - platform: iOS
            simulator-name: iPhone 17 Pro
            runtime-platform: iOS
    steps:
      - uses: actions/checkout@v4
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.3'
      - name: Ensure ${{ matrix.simulator-name }} simulator exists
        id: simulator
        if: matrix.platform != 'macOS'
        env:
          SIMULATOR_NAME: ${{ matrix.simulator-name }}
          RUNTIME_PLATFORM: ${{ matrix.runtime-platform }}
        run: |
          device_type_identifier="$(
            xcrun simctl list devicetypes --json |
              jq -er --arg name "$SIMULATOR_NAME" \
                'first(.devicetypes[] | select(.name == $name) | .identifier)'
          )"
          runtime_identifier="$(
            xcrun simctl list runtimes available --json |
              jq -er --arg platform "$RUNTIME_PLATFORM" '
                [.runtimes[] | select(.name | startswith($platform + " "))]
                | sort_by(.version | split(".") | map(tonumber))
                | last
                | .identifier
              '
          )"
          if device_identifier="$(
            xcrun simctl list devices available --json |
              jq -er --arg name "$SIMULATOR_NAME" --arg runtime "$runtime_identifier" \
                'first(.devices[$runtime][] | select(.name == $name) | .udid)'
          )"; then
            echo "Using existing $SIMULATOR_NAME ($device_identifier)"
          else
            device_identifier="$(xcrun simctl create "$SIMULATOR_NAME" "$device_type_identifier" "$runtime_identifier")"
          fi
          echo "device-id=$device_identifier" >> "$GITHUB_OUTPUT"
      - name: Build for ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi
          xcodebuild build -scheme RoundTrip -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          xcodebuild build -scheme RoundTripREST -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test on ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi
          xcodebuild test -scheme RoundTrip-Package -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

  checks:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install development tools
        run: |
          brew bundle install
          mint bootstrap
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Test Swift Package Manager
        run: make tests
      - name: Test examples
        run: make examples
